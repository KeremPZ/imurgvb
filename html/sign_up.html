<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/sign_up.css" />
    <title>imurgvb - Sign Up</title>
    <meta name="keywords" content="imurgvb" />
    <link
      rel="shortcut icon"
      href="/img/faviko/faviko.png"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="site-logo">
        <a href="/index.html">
          <img src="/img/logo/i.png" alt="imurgvb logo" />
        </a>
      </div>
    </header>

    <main class="form-container">
      <form action="" method="post" class="sign-up-form">
        <h2>Account Register</h2>

        <!-- Ad ve Soyad -->
        <div class="input-row">
          <div class="input-group">
            <input
              type="text"
              name="first_name"
              id="first-name"
              placeholder="Name"
              required
            />
          </div>
          <div class="input-group">
            <input
              type="text"
              name="last_name"
              id="last-name"
              placeholder="Surname"
              required
            />
          </div>
        </div>

        <!-- Doğum Tarihi -->
        <div class="input-group dob-group">
          <label class="input-label">Doğum Tarihi</label>
          <div class="dob-selects">
            <select name="dob_day" id="dob-day" required>
              <option value="" disabled selected>Gün</option>
            </select>

            <select name="dob_month" id="dob-month" required>
              <option value="" disabled selected>Ay</option>
              <option value="1">Ocak</option>
              <option value="2">Şubat</option>
              <option value="3">Mart</option>
              <option value="4">Nisan</option>
              <option value="5">Mayıs</option>
              <option value="6">Haziran</option>
              <option value="7">Temmuz</option>
              <option value="8">Ağustos</option>
              <option value="9">Eylül</option>
              <option value="10">Ekim</option>
              <option value="11">Kasım</option>
              <option value="12">Aralık</option>
            </select>

            <select name="dob_year" id="dob-year" required>
              <option value="" disabled selected>Yıl</option>
            </select>
          </div>
        </div>

        <!-- Cinsiyet -->
        <div class="input-group">
          <label for="gender-select" class="input-label">Cinsiyet</label>
          <select name="gender" id="gender-select" required>
            <option value="" disabled selected>Cinsiyet seçiniz</option>
            <option value="male">Erkek</option>
            <option value="female">Kadın</option>
            <option value="unspecified">Belirtmek istemiyorum</option>
          </select>
        </div>

        <!-- E-Posta -->
        <div class="input-group">
          <input
            type="email"
            name="email"
            id="email"
            placeholder="E-posta"
            required
          />
        </div>

        <!-- Şifre -->
        <div class="input-group">
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Şifre"
            required
          />
        </div>

        <button type="submit" class="submit-btn">Sign Up</button>
      </form>
    </main>

    <footer>
      <div class="foot">
        <p>terms</p>
        <p>privacy</p>
      </div>
    </footer>

    <script src="/js/birthday.js"></script>
  </body>
</html>
