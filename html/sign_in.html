<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/sign_in.css" />
    <title>imurgvb - Sign In</title>
    <meta name="keywords" content="imurgvb" />
    <link
      rel="shortcut icon"
      href="/img/faviko/faviko.png"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="site-logo">
        <a href="/index.html">
          <img src="/img/logo/i.png" alt="imurgvb logo" />
        </a>
      </div>
    </header>

    <main>
      <div class="sign-in-form">
        <div class="sign-in-form-main">
          <form action="" method="post" id="signInForm">
            <div class="sign-in-form-main-input">
              <input type="text" name="username_email" id="email" placeholder="Username or Email" required />
            </div>
            <div class="sign-in-form-main-input">
              <input type="password" name="password" id="password" placeholder="Password" required />
            </div>
            <button type="submit">Sign in</button>
          </form>
        </div>
      </div>
    </main>

    <footer>
      <div class="foot">
        <p>terms</p>
        <p>privacy</p>
      </div>
    </footer>
    <script src="/js/sign_in.js"></script>
  </body>
</html>
